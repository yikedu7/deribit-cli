[package]
name = "deribit-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
description = "Deribit CLI for market data, account queries, and WebSocket JSON-RPC"
repository = "https://github.com/yikedu7/deribit-cli"
homepage = "https://github.com/yikedu7/deribit-cli"
documentation = "https://docs.rs/deribit-cli"
include = [
    "assets/api-method-manifest-v1.json",
    "assets/api-catalog.json",
    "assets/api-testnet-coverage.json",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "rust-toolchain.toml",
    "src/**",
]

[dependencies]
aws-lc-rs = { version = "1", default-features = false }
clap = { version = "4.5", default-features = false, features = ["error-context", "help", "std", "string", "usage"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tabled = { version = "0.20", default-features = false, features = ["std"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
